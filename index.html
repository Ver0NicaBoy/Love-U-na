<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ขอโทษนะ 💗</title>

<style>

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ffd6e7,#fff0f6);
font-family:sans-serif;
overflow:hidden;
}

.card{
background:white;
padding:35px;
width:320px;
border-radius:25px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.15);
animation:pop 1s;
position:relative;
z-index:2;
}

@keyframes pop{
from{
transform:scale(.7);
opacity:0;
}
to{
transform:scale(1);
opacity:1;
}
}

h1{
color:#ff4f88;
font-size:32px;
margin-bottom:15px;
}

p{
font-size:18px;
color:#555;
line-height:1.7;
}

.btn{
padding:12px 25px;
border:none;
border-radius:50px;
font-size:18px;
cursor:pointer;
transition:.3s;
margin:10px;
}

.yes{
background:#ff6fa2;
color:white;
}

.yes:hover{
transform:scale(1.1);
}

.no{
background:#ddd;
position:absolute;
}

.hidden{
display:none;
}

#msg{
margin-top:20px;
animation:fade .8s;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.heart{
position:fixed;
font-size:28px;
animation:float 4s linear forwards;
pointer-events:none;
}

@keyframes float{
0%{
transform:translateY(100vh);
opacity:1;
}
100%{
transform:translateY(-100px);
opacity:0;
}
}

</style>
</head>

<body>

<div class="card">

<h1>ขอโทษนะคนเก่ง 🥺💗</h1>

<p>
เค้ารู้ว่าเค้าทำให้เธอเสียใจ<br>
และเค้าก็เสียใจจริง ๆ<br><br>

เธอสำคัญกับเค้ามากนะ<br>
ขออีกโอกาสให้เค้าได้แก้ตัวได้มั้ย...
</p>


<button class="btn yes"
onclick="forgive()">

ให้อภัย 💕

</button>


<button
class="btn no"
id="noBtn">

ไม่ให้อภัย 😤

</button>



<div id="msg"
class="hidden">

<h2>
เย้ 🥹💗
</h2>

<p>

ขอบคุณที่ยังอยู่ด้วยกันนะ<br>

สัญญาว่าจะพยายามเป็นคนที่ดีกว่าเดิม<br><br>

รักเธอที่สุดเลย 💌

</p>

</div>

</div>


<script>

function forgive(){

//ซ่อนปุ่มทั้งหมด

document.querySelector(".yes")
.style.display="none";

document.getElementById("noBtn")
.style.display="none";


//โชว์ข้อความ

document.getElementById("msg")
.classList.remove("hidden");


//หัวใจลอย

for(let i=0;i<40;i++){

let heart=
document.createElement("div");

heart.className="heart";

heart.innerHTML=
["💖","💕","💗","💘"]
[Math.floor(Math.random()*4)];

heart.style.left=
Math.random()*100+"vw";

heart.style.animationDuration=
(Math.random()*3+2)+"s";

document.body.appendChild(
heart
);

setTimeout(()=>{

heart.remove();

},5000);

}

}



//ปุ่มไม่ให้อภัยวิ่งหนี

let noBtn=
document.getElementById(
"noBtn"
);

noBtn.addEventListener(
"mouseover",

()=>{

let x=
Math.random()*220;

let y=
Math.random()*220;

noBtn.style.left=
x+"px";

noBtn.style.top=
y+"px";

}

);

</script>

</body>
</html>
