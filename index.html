<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ขอโทษนะ 💗</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ffd6e7,#ffeef5);
    font-family:sans-serif;
    overflow:hidden;
}

.card{
    background:white;
    padding:35px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
    width:320px;
    animation:pop 1s;
}

@keyframes pop{
from{
transform:scale(.7);
opacity:0;
}
to{
transform:scale(1);
opacity:1;
}
}

h1{
font-size:32px;
color:#ff4f88;
}

p{
font-size:18px;
color:#555;
line-height:1.6;
}

.btn{
padding:12px 25px;
border:none;
border-radius:50px;
font-size:18px;
cursor:pointer;
margin-top:15px;
transition:.3s;
}

.yes{
background:#ff6fa2;
color:white;
}

.yes:hover{
transform:scale(1.1);
}

.no{
background:#ddd;
position:absolute;
}

.heart{
position:fixed;
font-size:25px;
animation:float 4s linear infinite;
}

@keyframes float{
0%{
transform:translateY(100vh);
opacity:1;
}
100%{
transform:translateY(-100px);
opacity:0;
}
}

.hidden{
display:none;
}
</style>
</head>

<body>

<div class="card">

<h1>ขอโทษนะคนเก่ง 🥺💗</h1>

<p>
เค้ารู้ว่าเค้าทำให้เธอเสียใจ<br>
แต่เธอสำคัญกับเค้ามากจริงๆ<br><br>

ถ้าย้อนเวลาได้ เค้าจะไม่ทำแบบนั้นอีก<br>
ขอโอกาสให้เค้าแก้ตัวได้มั้ย...
</p>

<button class="btn yes" onclick="forgive()">
ให้อภัย 💕
</button>

<button class="btn no" id="noBtn">
ไม่ให้อภัย 😤
</button>

<div id="msg" class="hidden">
<h2>เย้! 🥹💗</h2>
<p>
ขอบคุณที่ยังอยู่ด้วยกันนะ<br>
รักเธอที่สุดเลย
</p>
</div>

</div>

<script>

function forgive(){
document.getElementById("msg").classList.remove("hidden");

for(let i=0;i<30;i++){
let heart=document.createElement("div");
heart.innerHTML="💖";
heart.className="heart";

heart.style.left=Math.random()*100+"vw";
heart.style.animationDuration=
(Math.random()*3+2)+"s";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},4000);
}
}

let no=document.getElementById("noBtn");

no.addEventListener("mouseover",()=>{
let x=Math.random()*300;
let y=Math.random()*300;

no.style.left=x+"px";
no.style.top=y+"px";
});

</script>

</body>
</html>
