<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ขอโทษนะ 💗</title>

<style>

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ffd6e7,#fff0f6);
font-family:sans-serif;
overflow:hidden;
}

.card{
background:white;
padding:35px;
width:330px;
border-radius:25px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.15);
position:relative;
z-index:2;
}

h1{
color:#ff4f88;
font-size:30px;
}

p{
color:#555;
line-height:1.7;
font-size:18px;
}

.buttons{
margin-top:20px;
}

.btn{
padding:12px 24px;
border:none;
border-radius:50px;
cursor:pointer;
font-size:18px;
transition:.3s;
}

.yes{
background:#ff6fa2;
color:white;
}

.yes:hover{
transform:scale(1.08);
}

.no{
background:#ddd;
position:fixed;
}

.hidden{
display:none;
}

#msg{
margin-top:20px;
animation:fade .8s;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.heart{
position:fixed;
font-size:30px;
animation:float 4s linear forwards;
pointer-events:none;
}

@keyframes float{

0%{
transform:
translateY(100vh);
opacity:1;
}

100%{
transform:
translateY(-100px);
opacity:0;
}

}

</style>
</head>

<body>


<div class="card">

<h1>
ขอโทษนะคนเก่ง 🥺💗
</h1>

<p>

เค้ารู้ว่าเค้าทำให้เธอเสียใจ<br>

แต่เธอสำคัญกับเค้ามากจริง ๆ<br><br>

ขออีกโอกาสให้เค้าได้แก้ตัวได้มั้ย...

</p>



<div
class="buttons"
id="buttons">

<button
class="btn yes"
onclick="forgive()">

ให้อภัย 💕

</button>


<button
class="btn no"
id="noBtn">

ไม่ให้อภัย 😤

</button>

</div>



<div
id="msg"
class="hidden">

<h2>
เย้ 🥹💗
</h2>

<p>

ขอบคุณที่ยังอยู่ด้วยกันนะ<br>

สัญญาว่าจะพยายามเป็นคนที่ดีกว่าเดิม<br><br>

รักเธอที่สุดเลย 💌

</p>

</div>


</div>



<script>


function forgive(){

// ลบปุ่มทั้งหมด
document
.getElementById(
"buttons"
)
.remove();


// แสดงข้อความ
document
.getElementById(
"msg"
)
.classList
.remove(
"hidden"
);


// หัวใจลอย

for(
let i=0;
i<50;
i++
){

let heart=
document
.createElement(
"div"
);

heart.className=
"heart";

heart.innerHTML=
["💖","💕","💗","💘"]
[Math.floor(
Math.random()*4
)];

heart.style.left=
Math.random()
*100+
"vw";

heart.style.animationDuration=
(Math.random()*3+2)
+"s";


document.body
.appendChild(
heart
);


setTimeout(
()=>{

heart.remove()

},
5000
);

}

}



// ปุ่มไม่ให้อภัยหนีทั่วจอ

let no =
document.getElementById(
"noBtn"
);


no.addEventListener(
"mouseover",

()=>{

let maxX =
window.innerWidth
-120;

let maxY =
window.innerHeight
-80;


let x =
Math.random()
*maxX;


let y =
Math.random()
*maxY;


no.style.position =
"fixed";


no.style.left =
x+"px";


no.style.top =
y+"px";

}

);


</script>

</body>
</html>
